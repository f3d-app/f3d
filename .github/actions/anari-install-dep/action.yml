name: "Install Anari Dependency"
description: "Install Anari Dependency using cache when possible"
inputs:
  versions_file:
    description: "File to recover versions from"
    required: true
  mindeps_label:
    description: "Label to flag for minimum versions dependencies"
    required: false
    default: "no-mindeps"
  cpu:
    description: "CPU architecture to build for"
    required: false
    default: "x86_64"

runs:
  using: "composite"
  steps:
    - name: Check required inputs
      shell: bash
      run: |
        [[ "${{inputs.versions_file}}" ]] || { echo "versions_file is empty" ; exit 1; }

    - name: Extract Anari version
      id: anari_ver
      uses: f3d-app/extract-version-action@main
      with:
        file: ${{inputs.versions_file}}
        name: anari
        minver_label: ${{inputs.mindeps_label == 'mindeps' && 'minver' || ''}}

    - name: Extract global cache index
      id: global_idx
      uses: f3d-app/extract-version-action@main
      with:
        file: ${{inputs.versions_file}}
        special_name: global_cache_index

    - name: Cache Anari
      id: cache-anari
      continue-on-error: true # https://github.com/actions/cache/issues/1754
      uses: actions/cache/restore@v6
      with:
        path: dependencies/anari_install
        key: anari-${{steps.anari_ver.outputs.extract}}-${{runner.os}}-${{inputs.cpu}}-${{steps.global_idx.outputs.extract}}-0

    - name: Checkout Anari
      if: steps.cache-anari.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: KhronosGroup/ANARI-SDK
        path: "./dependencies/anari"
        ref: ${{steps.anari_ver.outputs.extract}}

    - name: Setup Anari
      if: steps.cache-anari.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/dependencies
      shell: bash
      run: |
        mkdir anari_build
        mkdir anari_install

    - name: Configure Anari
      if: steps.cache-anari.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/dependencies/anari_build
      shell: bash
      run: >
        cmake ../anari
        -DBUILD_EXAMPLES=OFF
        -DBUILD_TESTING=OFF
        -DBUILD_SHARED_LIBS=ON
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=../anari_install
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        -Danari_JS_GLUE=OFF
        ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0' || null }}
        ${{ runner.os == 'Windows' && '-Ax64 -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL' || null }}

    - name: Build Anari
      if: steps.cache-anari.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/dependencies/anari_build
      shell: bash
      run: cmake --build . --parallel 2 --target install --config Release

    - name: Copy to install
      working-directory: ${{github.workspace}}/dependencies/anari_install
      shell: bash
      run: cp -r ./* ../install/

    - name: Save cache
      if: steps.cache-anari.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.cache-anari.outputs.cache-primary-key }}
        path: dependencies/anari_install
